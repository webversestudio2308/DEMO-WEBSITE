 Glam Makeup",category:"Makeup",description:"Glamorous smokey eyes, sculpted cheekbones, dewy complexion, and premium lash application for your soirée.",price:"₹4,500",duration:"90 mins",imageUrl:"https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?q=80&w=800&auto=format&fit=crop",active:!0,order:4},{id:"srv-5",name:"Facial & Botanical Skincare",category:"Skincare",description:"24K Gold luxury facial, organic fruit brightening peel, and lymphatic drainage massage to restore youthfulness.",price:"₹3,800",duration:"60 mins",imageUrl:"https://images.unsplash.com/photo-1616394584738-fc6e612e71b9?q=80&w=800&auto=format&fit=crop",active:!0,order:5},{id:"srv-6",name:"Rose Quartz Manicure & Pedicure",category:"Spa",description:"Exfoliating sea salt soak, botanical scrub, warm paraffin wrap, cuticle care, and soothing reflexology massage.",price:"₹2,200",duration:"60 mins",imageUrl:"https://images.unsplash.com/photo-1607779097040-26e80aa78e66?q=80&w=800&auto=format&fit=crop",active:!0,order:6},{id:"srv-7",name:"Gentle Rica & Chocolate Waxing",category:"Skincare",description:"Hypoallergenic Italian liposoluble waxes enriched with soothing aloe vera for pain-free, velvety smooth results.",price:"₹1,500",duration:"45 mins",imageUrl:"https://images.unsplash.com/photo-1570172619644-dfd03ed5d881?q=80&w=800&auto=format&fit=crop",active:!0,order:7},{id:"srv-8",name:"Eyebrow Couture & Threading",category:"Threading",description:"Geometric brow mapping, precision thread shaping, and botanical soothing gel application for perfect facial framing.",price:"₹350",duration:"20 mins",imageUrl:"https://images.unsplash.com/photo-1583001931096-959e9a1a6223?q=80&w=800&auto=format&fit=crop",active:!0,order:8},{id:"srv-9",name:"Hair Coloring & Balayage",category:"Hair",description:"Sun-kissed hand-painted balayage, dimensional glossing, and ammonia-free root coverage by master colorists.",price:"₹5,500",duration:"120 mins",imageUrl:"https://images.unsplash.com/photo-1605497788044-5a32c7078486?q=80&w=800&auto=format&fit=crop",active:!0,order:9},{id:"srv-10",name:"Luxury Gel Extensions & Nail Art",category:"Nails",description:"Sculpted acrylic/gel extensions with 3D chrome details, French ombré, and Swarovski crystal embellishments.",price:"₹2,600",duration:"90 mins",imageUrl:"https://images.unsplash.com/photo-1632345031435-8727f6897d53?q=80&w=800&auto=format&fit=crop",active:!0,order:10}],nd=[{id:"gal-1",title:"Royal Crimson Bridal Look",category:"Bridal",imageUrl:"https://images.unsplash.com/photo-1617627143750-d86bc21e42bb?q=80&w=1000&auto=format&fit=crop",description:"Handcrafted bridal styling with traditional gold kundan and soft glowing skin.",order:1,active:!0,createdAt:"2026-03-01"},{id:"gal-2",title:"Editorial Champagne Glam",category:"Makeup",imageUrl:"https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?q=80&w=1000&auto=format&fit=crop",description:"Dewy glass skin finish with metallic champagne shimmer lids.",order:2,active:!0,createdAt:"2026-03-02"},{id:"gal-3",title:"Caramel Honey Balayage",category:"Hair",imageUrl:"https://images.unsplash.com/photo-1605497788044-5a32c7078486?q=80&w=1000&auto=format&fit=crop",description:"Seamless dimensional blending on dark cascading curls.",order:3,active:!0,createdAt:"2026-03-03"},{id:"gal-4",title:"Minimalist Gold Foil Nails",category:"Nails",imageUrl:"https://images.unsplash.com/photo-1632345031435-8727f6897d53?q=80&w=1000&auto=format&fit=crop",description:"Almond shaped nude base accented with authentic 24k gold leaf flakes.",order:4,active:!0,createdAt:"2026-03-04"},{id:"gal-5",title:"Haute Makeover & Cosmetics",category:"Makeup",imageUrl:"https://images.unsplash.com/photo-1596462502278-27bfdc403348?q=80&w=1000&auto=format&fit=crop",description:"Bespoke color palettes, velvet lip finishes, and sculpted contours.",order:5,active:!0,createdAt:"2026-03-05"},{id:"gal-6",title:"The Emerald VIP Sanctuary",category:"Salon",imageUrl:"https://images.unsplash.com/photo-1560066984-138dadb4c035?q=80
